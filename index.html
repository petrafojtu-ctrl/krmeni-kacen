<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Krmení kačen</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#14201d;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#1d2a25;display:grid;place-items:center;min-height:100vh}.app{width:min(100%,480px);min-height:100vh;background:#f3f5ec;overflow:hidden;position:relative}.screen{min-height:100vh;padding:20px}.hidden{display:none!important}h1{margin:22px 0 4px;text-align:center;font-size:28px}p{text-align:center;margin:0 0 22px;color:#65726b}.card{width:100%;border:0;padding:0;background:#fff;border-radius:24px;overflow:hidden;text-align:left;margin:0 0 16px;box-shadow:0 12px 28px #0002}.scene{height:220px;position:relative;overflow:hidden;background:linear-gradient(#b9e4f4 0 39%,#80a66d 39% 51%,#5597ad 51%)}.sky-cloud{position:absolute;width:78px;height:23px;background:#fff9;border-radius:50px;top:24px;left:38px;box-shadow:24px 7px 0 3px #fff8,46px -2px 0 #fff7}.hill.back{position:absolute;left:-12%;right:-12%;top:29%;height:23%;border-radius:48% 52% 0 0;background:#6c8d62}.hill.front{position:absolute;left:-20%;right:-20%;top:35%;height:20%;border-radius:48% 52% 0 0;background:#53774d}.tree-line{position:absolute;left:0;right:0;top:41%;height:13%;background:repeating-linear-gradient(75deg,#456b45 0 12px,#5e8150 12px 24px)}.house{position:absolute;left:45%;top:40%;width:31%;height:11%;background:#a64d3c;border-radius:2px;box-shadow:0 3px 0 #0002}.house:before{content:"";position:absolute;left:-4%;right:-4%;top:-25%;height:27%;background:#7f392e;clip-path:polygon(3% 100%,9% 0,91% 0,97% 100%)}.house:after{content:"";position:absolute;left:8%;right:8%;top:42%;height:17%;background:repeating-linear-gradient(90deg,#e6dcc5 0 10%,transparent 10% 22%)}.dock{position:absolute;left:0;top:57%;width:34%;height:6%;background:linear-gradient(#aa7b49,#7e5934);box-shadow:0 5px 0 #684a31}.dock:after{content:"";position:absolute;width:5px;height:33px;right:16%;top:100%;background:#65472f;box-shadow:-92px 0 #65472f}.waterline{position:absolute;inset:51% 0 0;background:linear-gradient(#6aaac0 0,#4f91aa 38%,#33758e 100%)}.waterline:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(180deg,#ffffff16 0 2px,transparent 2px 17px)}.reed{position:absolute;bottom:0;width:4px;background:#557241;border-radius:99px;transform-origin:bottom}.cardinfo{padding:14px 16px}.name{font-size:19px;font-weight:850}.loc{font-size:13px;color:#66736c}.status{margin-top:8px;font-weight:800}.locked{opacity:.6}.lock{position:absolute;inset:0;display:grid;place-items:center;font-size:42px;background:#18251e22}
.game{position:relative;padding:0;overflow:hidden;background:#c2e7f2;touch-action:none}.game .sky{position:absolute;inset:0 0 auto;height:28%;background:linear-gradient(#a9dff2,#d8edf3)}.game .cloud{position:absolute;width:92px;height:25px;background:#fff9;border-radius:50px;top:8%;left:10%;box-shadow:27px 8px 0 2px #fff8,54px 1px 0 #fff7}.game .mountain{position:absolute;left:-12%;right:-12%;top:17%;height:17%;background:#719169;clip-path:polygon(0 80%,12% 55%,23% 72%,34% 34%,46% 70%,59% 45%,70% 76%,84% 51%,100% 75%,100% 100%,0 100%)}.game .shore{position:absolute;left:0;right:0;top:27%;height:9%;background:#668a58}.game .shore:after{content:"";position:absolute;left:0;right:0;bottom:-5px;height:8px;background:repeating-linear-gradient(90deg,#4c7447 0 13px,#5c8251 13px 26px)}.game .house{top:25%;z-index:4}.game .dock{top:34%;z-index:5}.water{position:absolute;inset:32% 0 0;background:linear-gradient(#62a4ba 0,#4389a2 48%,#2b6b83 100%);overflow:hidden}.water:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(180deg,#ffffff14 0 2px,transparent 2px 21px);pointer-events:none}.water-glint{position:absolute;z-index:2;border-radius:50%;border-top:2px solid #ffffff61;width:80px;height:18px}.top{position:absolute;z-index:30;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;align-items:center;justify-content:space-between}.back{width:46px;height:46px;border-radius:14px;border:1px solid #0003;background:#fff9ea;font-size:22px}.title{text-align:center;font-size:21px;font-weight:900;text-shadow:0 1px #fff8}.title small{display:block;font-size:11px;opacity:.65}.duck{position:absolute;z-index:12;width:58px;height:36px;transform:translate(-50%,-50%);transition:left .9s ease,top .9s ease,transform .2s ease;filter:drop-shadow(0 4px 2px #0003)}.duck .body{position:absolute;left:8px;top:12px;width:39px;height:21px;border-radius:58% 45% 50% 48%;background:#785b3e}.duck .wing{position:absolute;left:14px;top:14px;width:22px;height:12px;border-radius:60%;background:#b89e7d;transform:rotate(-8deg)}.duck .neck{position:absolute;left:36px;top:7px;width:12px;height:17px;background:#2f5d47;border-radius:7px}.duck .head{position:absolute;left:38px;top:1px;width:19px;height:19px;border-radius:50%;background:#2a624b}.duck .eye{position:absolute;left:51px;top:6px;width:3px;height:3px;background:#111;border-radius:50%;z-index:2}.duck .beak{position:absolute;left:54px;top:9px;width:11px;height:6px;border-radius:60% 70% 70% 60%;background:#d69b2e}.duck .tail{position:absolute;left:3px;top:12px;border:7px solid transparent;border-right-color:#6d5035;transform:rotate(-7deg)}.duck.female .head,.duck.female .neck{background:#846849}.duck.female .body{background:#84684b}.duck.female .wing{background:#9d805f}.food{position:absolute;width:13px;height:10px;border-radius:50%;background:#e6c37b;border:1px solid #0003;transform:translate(-50%,-50%);z-index:8}.ripple{position:absolute;width:18px;height:8px;border:2px solid #fff9;border-radius:50%;transform:translate(-50%,-50%);animation:rip 1s ease-out forwards;z-index:7}@keyframes rip{to{width:85px;height:34px;opacity:0}}.feed{position:absolute;z-index:35;bottom:max(16px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#17231fdf;color:white;border-radius:18px;padding:10px 16px;font-weight:900;backdrop-filter:blur(6px)}.hint{position:absolute;z-index:30;bottom:76px;left:50%;transform:translateX(-50%);background:#17231fc0;color:white;padding:9px 13px;border-radius:13px;font-size:13px;font-weight:750;white-space:nowrap}.bubble{position:absolute;z-index:40;max-width:190px;background:#fff6dd;border:2px solid #272727;border-radius:15px;padding:8px 10px;font-size:13px;font-weight:850;text-align:center;transform:translate(-50%,-120%);box-shadow:0 4px 0 #0002}.end{position:absolute;z-index:50;left:50%;top:48%;transform:translate(-50%,-50%);background:#17231fee;color:white;padding:18px;border-radius:18px;text-align:center;font-weight:900}.end button{margin:10px 4px 0;border:0;border-radius:12px;padding:11px 13px;font-weight:850;background:#fff0c4;color:#17231f}.pigeon{position:absolute;z-index:45;left:-90px;top:17%;width:70px;height:34px;animation:flyAcross 5.8s linear forwards;pointer-events:none;filter:drop-shadow(0 3px 2px #0004)}.pigeon .pbody{position:absolute;left:18px;top:13px;width:36px;height:17px;border-radius:55%;background:#777f86}.pigeon .phead{position:absolute;left:45px;top:5px;width:16px;height:16px;border-radius:50%;background:#69747a}.pigeon .pbeak{position:absolute;left:59px;top:10px;border:5px solid transparent;border-left-color:#d9a852}.pigeon .wing{position:absolute;left:20px;top:4px;width:28px;height:12px;border-radius:70% 10% 70% 10%;background:#9299a0;transform:rotate(-22deg);transform-origin:right center;animation:flap .28s ease-in-out infinite alternate}.pigeon .wing.two{transform:rotate(22deg);top:17px;animation-direction:alternate-reverse}@keyframes flap{to{transform:rotate(18deg)}}@keyframes flyAcross{0%{left:-90px;top:18%}45%{top:12%}100%{left:110%;top:20%}}
@media(prefers-reduced-motion:reduce){.duck{transition:none}.ripple,.pigeon,.pigeon .wing{animation:none}.pigeon{left:42%;top:16%}}
</style>
</head>
<body>
<main class="app">
<section class="screen" id="select">
<h1>Krmení kačen 🦆</h1><p>Kam dneska půjdeme krmit?</p>
<button class="card" id="open">
<div class="scene"><div class="sky-cloud"></div><div class="hill back"></div><div class="hill front"></div><div class="tree-line"></div><div class="house"></div><div class="dock"></div><div class="waterline"></div></div>
<div class="cardinfo"><div class="name">Kacabaja</div><div class="loc">Hodslavice</div><div class="status">Jít krmit →</div></div></button>
<div class="card locked"><div class="scene"><div class="sky-cloud"></div><div class="hill back"></div><div class="hill front"></div><div class="waterline"></div><div class="lock">🔒</div></div><div class="cardinfo"><div class="name">Krhová</div><div class="loc">Valašsko</div><div class="status">Zatím zamčeno</div></div></div>
</section>
<section class="screen game hidden" id="game">
<div class="sky"></div><div class="cloud"></div><div class="mountain"></div><div class="shore"></div><div class="water" id="water"></div><div class="house"></div><div class="dock"></div>
<div class="top"><button class="back" id="back" aria-label="Zpět">←</button><div class="title">Kacabaja<small>Hodslavice</small></div><div style="width:46px"></div></div>
<div class="hint" id="hint">Klepni do vody a hoď krmení</div><div class="feed">🥣 <span id="count">12</span></div>
</section>
</main>
<script>
const select=document.querySelector('#select'),game=document.querySelector('#game'),water=document.querySelector('#water'),count=document.querySelector('#count'),hint=document.querySelector('#hint');
let food=12,ended=false,bubble=null,last=-1,lastSpeech=0,pigeonTimer=null;
const lines=['Cype!','Zdeno!','No do řiti.','Ten zvuk ignoruj. Já ho ignoruju roky.','Hoď cosik. Pak se můžeme bavit.','Neházaj to tak daleko, nejsem Bolt.','No. Konečně robota.','Hoď ještě. Toto ani necítím.','Motor teplý. Můžeš sypat.','Kdo ti řekl, že to tak má fungovat?','To bude těsnění pod hlavou.','Ty nějak divně táhneš.','Něco tu chcípne. A motor to nebude.'];
const spots=[[25,47,false],[54,54,false],[76,45,true],[38,69,true],[72,72,false]];
const ducks=spots.map(([x,y,f])=>{let d=document.createElement('span');d.className='duck'+(f?' female':'');d.innerHTML='<i class="tail"></i><i class="body"></i><i class="wing"></i><i class="neck"></i><i class="head"></i><i class="eye"></i><i class="beak"></i>';d.style.left=x+'%';d.style.top=y+'%';game.append(d);return d});
function getPlayCount(){try{return Number(localStorage.getItem('kacabajaPlayCount')||0)}catch{return 0}}
function setPlayCount(n){try{localStorage.setItem('kacabajaPlayCount',String(n))}catch{}}
function startRound(){let n=getPlayCount()+1;setPlayCount(n);if(n%5===0){clearTimeout(pigeonTimer);pigeonTimer=setTimeout(spawnPigeon,3500+Math.random()*4500)}}
function spawnPigeon(){if(game.classList.contains('hidden')||ended)return;let p=document.createElement('div');p.className='pigeon';p.setAttribute('aria-hidden','true');p.innerHTML='<i class="wing"></i><i class="wing two"></i><i class="pbody"></i><i class="phead"></i><i class="pbeak"></i>';game.append(p);setTimeout(()=>p.remove(),6200)}
function openGame(){select.classList.add('hidden');game.classList.remove('hidden');startRound()}
function map(){clearTimeout(pigeonTimer);game.classList.add('hidden');select.classList.remove('hidden')}
document.querySelector('#open').onclick=openGame;document.querySelector('#back').onclick=map;
function clearBubble(){if(bubble){bubble.remove();bubble=null}}
function say(d){let now=Date.now();if(now-lastSpeech<6500||Math.random()>.18)return;let i;do{i=Math.floor(Math.random()*lines.length)}while(i===last);last=i;lastSpeech=now;clearBubble();bubble=document.createElement('div');bubble.className='bubble';bubble.textContent=lines[i];game.append(bubble);let r=d.getBoundingClientRect(),g=game.getBoundingClientRect();bubble.style.left=r.left-g.left+r.width/2+'px';bubble.style.top=r.top-g.top+'px';setTimeout(clearBubble,2600)}
function reset(){document.querySelector('.end')?.remove();food=12;count.textContent=food;ended=false;hint.classList.remove('hidden');startRound()}
function finish(){ended=true;let e=document.createElement('div');e.className='end';e.innerHTML='Krmení došlo 🦆<br><button id="again">Krmit znovu</button><button id="ponds">Rybníky</button>';game.append(e);e.querySelector('#again').onclick=reset;e.querySelector('#ponds').onclick=()=>{e.remove();map();food=12;count.textContent=food;ended=false;hint.classList.remove('hidden')}}
function toss(clientX,clientY){if(ended||food<=0)return;let g=game.getBoundingClientRect(),x=clientX-g.left,y=clientY-g.top;if(y<g.height*.32)return;hint.classList.add('hidden');food--;count.textContent=food;let f=document.createElement('i');f.className='food';f.style.left=x+'px';f.style.top=y+'px';game.append(f);let rp=document.createElement('i');rp.className='ripple';rp.style.left=x+'px';rp.style.top=y+'px';game.append(rp);setTimeout(()=>rp.remove(),1000);let nearest=ducks[0],best=Infinity;ducks.forEach(d=>{let r=d.getBoundingClientRect(),dx=r.left-g.left+r.width/2-x,dy=r.top-g.top+r.height/2-y,z=dx*dx+dy*dy;if(z<best){best=z;nearest=d}});let nr=nearest.getBoundingClientRect();nearest.style.transform=(x < nr.left-g.left?'translate(-50%,-50%) scaleX(-1)':'translate(-50%,-50%) scaleX(1)');nearest.style.left=Math.max(7,Math.min(92,x/g.width*100))+'%';nearest.style.top=Math.max(38,Math.min(85,y/g.height*100))+'%';setTimeout(()=>{f.remove();nearest.style.transform='translate(-50%,-50%) scaleX(1)';say(nearest);if(food===0)setTimeout(finish,600)},900)}
water.addEventListener('pointerdown',e=>toss(e.clientX,e.clientY));
setInterval(()=>{if(ended||game.classList.contains('hidden'))return;ducks.forEach(d=>{if(Math.random()<.25){d.style.left=10+Math.random()*80+'%';d.style.top=40+Math.random()*40+'%'}})},3300);
</script>
</body></html>
